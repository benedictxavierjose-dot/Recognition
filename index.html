<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deteksi Objek Real-Time dengan AI</title>
    <!-- Memuat TensorFlow.js -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <!-- Memuat model COCO-SSD -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f0f0f0;
            margin: 0;
            padding: 20px;
        }
        #container {
            position: relative;
            margin-top: 20px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            border-radius: 8px;
            overflow: hidden;
            background-color: #000;
        }
        video {
            display: block;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
        }
        #status {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>

    <h2>AI Object Detection (Kamera Real-Time)</h2>
    <div id="status">Memuat model AI... Mohon tunggu.</div>

    <div id="container">
        <!-- Video untuk menampilkan feed kamera -->
        <video id="webcam" autoplay muted playsinline width="640" height="480"></video>
        <!-- Canvas untuk menggambar kotak deteksi -->
        <canvas id="canvas" width="640" height="480"></canvas>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const statusText = document.getElementById('status');

        // Fungsi untuk mengaktifkan kamera
        async function setupWebcam() {
            return new Promise((resolve, reject) => {
                navigator.mediaDevices.getUserMedia({ video: true })
                    .then(stream => {
                        video.srcObject = stream;
                        video.addEventListener('loadeddata', () => resolve(), false);
                    })
                    .catch(error => {
                        statusText.innerText = "Akses kamera ditolak atau tidak ditemukan.";
                        reject(error);
                    });
            });
        }

        // Fungsi utama untuk mendeteksi objek
        async function detectFrame(model) {
            // Deteksi objek dari frame video saat ini
            const predictions = await model.detect(video);
            
            // Bersihkan canvas dari frame sebelumnya
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Gambar kotak dan teks untuk setiap objek yang terdeteksi
            predictions.forEach(prediction => {
                const [x, y, width, height] = prediction.bbox;
                const text = `${prediction.class} - ${Math.round(prediction.score * 100)}%`;

                // Gambar kotak (bounding box)
                ctx.strokeStyle = '#00FF00';
                ctx.lineWidth = 4;
                ctx.strokeRect(x, y, width, height);

                // Background untuk teks
                ctx.fillStyle = '#00FF00';
                ctx.fillRect(x, y, ctx.measureText(text).width + 10, 25);

                // Tulis nama objek dan tingkat akurasi
                ctx.fillStyle = '#000000';
                ctx.font = '18px Arial';
                ctx.fillText(text, x + 5, y + 18);
            });

            // Loop fungsi ini secara terus-menerus
            requestAnimationFrame(() => detectFrame(model));
        }

        // Jalankan aplikasi
        async function app() {
            try {
                await setupWebcam();
                const model = await cocoSsd.load();
                statusText.innerText = "Model siap! Arahkan kamera ke berbagai objek.";
                detectFrame(model);
            } catch (error) {
                console.error("Terjadi kesalahan:", error);
            }
        }

        app();
    </script>
</body>
</html>
